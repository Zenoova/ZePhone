[package]
name = "zephone"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zephone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-log = "2.10.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
log = "0.4.35"
secrecy = "0.10.3"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
cpal = "0.18.2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
unicode-normalization = "0.1.26"
sha2 = "0.11.1"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
md-5 = "0.11.0"
tempfile = "3.27.0"

# Computers only: one instance, shortcuts that work in any application, start at login.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.3"

# The OS credential store (Keychain on macOS and iOS, Credential Manager, Secret Service; Android keeps a private file),
# and TLS: the system's library on a computer or an iPhone, rustls on Android (which has no OpenSSL to link against).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "system-proxy"] }
native-tls = "0.2.18"

[target.'cfg(target_os = "android")'.dependencies]
# The audio route of a call goes through the Java AudioManager (src/app/call_audio.rs).
jni = "0.21"
ndk-context = "0.1"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }

# Apple systems: the microphone permission, the address book (and, on iOS, the audio session of a call).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = "0.3.2"
objc2-contacts = { version = "0.3.2", default-features = false, features = ["std", "block2", "CNContact", "CNContactStore", "CNContactFetchRequest", "CNFetchRequest", "CNLabeledValue", "CNPhoneNumber", "CNInstantMessageAddress"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes", "AVAudioSessionRoute", "bitflags", "block2"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
