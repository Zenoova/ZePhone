name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  backend:
    name: Backend (Rust unit tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libopus-dev libasound2-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsecret-1-dev
      - run: npm ci
      - name: Placeholders for what the Tauri build checks for (the engine itself is not needed by unit tests)
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries src-tauri/resources/baresip/modules src-tauri/resources/baresip/sounds \
            src-tauri/resources/baresip/licenses dist
          touch "src-tauri/binaries/baresip-$triple" src-tauri/resources/baresip/modules/.keep \
            src-tauri/resources/baresip/licenses/.keep
          # The ring tones the tests decode: the committed copies stand in for the ones the engine build stages.
          cp src-tauri/android/sounds/*.wav src-tauri/resources/baresip/sounds/
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
