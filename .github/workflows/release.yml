name: Release

# Pushing to `stable` makes a release, the conventional way:
#   1. the commits since the last release tag (Conventional Commits: feat, fix, perf, breaking `!`) decide the next
#      version (scripts/next-version.mjs). Nothing to release means nothing happens;
#   2. the new version is committed to `stable` (package.json, tauri.conf.json, Cargo.toml, CHANGELOG.md), so the
#      application carries it;
#   3. every installer is built from that commit and attached to a GitHub Release, which is then published;
#   4. distribute.yml sends it to the stores and package managers.
#
# Run it by hand ("Run workflow") on any branch to test the builds: it creates a DRAFT release, commits nothing and
# publishes nothing. Give a version to build that one, or leave it empty to follow the commits.
on:
  push:
    branches: [stable]
  workflow_dispatch:
    inputs:
      version:
        description: "Build this version (X.Y.Z) as a draft; empty follows the commits"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------------------ the release
  meta:
    name: Version and draft release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      sha: ${{ steps.commit.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history and the tags decide the version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        env:
          GIVEN: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
        run: |
          # Only `stable` publishes; any other run is a test build.
          if [[ "$REF" == "refs/heads/stable" ]]; then publish=true; else publish=false; fi
          if [[ -n "$GIVEN" ]]; then
            version="${GIVEN#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$GIVEN' is not a version like 1.2.3"; exit 1; }
            release=true
            printf 'Test build of %s.\n' "$version" > "$RUNNER_TEMP/notes.md"
          else
            node scripts/next-version.mjs --notes "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/decision.json"
            cat "$RUNNER_TEMP/decision.json"
            release="$(jq -r .release "$RUNNER_TEMP/decision.json")"
            version="$(jq -r .version "$RUNNER_TEMP/decision.json")"
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          [[ "$release" == "true" ]] || echo "Nothing to release: no feat, fix, perf or breaking commit since the last release."

      # The version goes into the files that carry it, in a commit of its own, so that the application and the
      # repository say the same thing as the tag. The tag will point at this commit.
      - id: commit
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            node scripts/set-version.mjs "$VERSION"
            node scripts/next-version.mjs --changelog CHANGELOG.md > /dev/null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
            git commit -m "chore(release): v$VERSION" || echo "the files already carry this version"
            git push origin HEAD:stable
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)"
          if [[ -z "$id" ]]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$SHA" \
              -f name="ZePhone $VERSION" -F body=@"$RUNNER_TEMP/notes.md" -F draft=true --jq .id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------------ computers
  desktop:
    name: ${{ matrix.name }}
    needs: meta
    if: needs.meta.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: Windows (x64), os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux (x64), os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: Linux (arm64), os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      ZEPHONE_SENTRY_DSN: ${{ vars.ZEPHONE_SENTRY_DSN }}
      ZEPHONE_GA_MEASUREMENT_ID: ${{ vars.ZEPHONE_GA_MEASUREMENT_ID }}
      ZEPHONE_GA_API_SECRET: ${{ secrets.ZEPHONE_GA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl pkg-config xz-utils libssl-dev libopus-dev \
            libasound2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libsecret-1-dev patchelf rpm file
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf opus spandsp libre

      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: .baresip-build
          key: baresip-${{ matrix.target }}-${{ hashFiles('scripts/build-baresip*', 'scripts/prepare-baresip.sh', 'scripts/sidecar.mjs', 'scripts/baresip-modules/**') }}

      - run: npm ci
      - run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"
        shell: bash

      # The engine (Baresip with Opus and G.722, plus ZePhone's own modules) is built from source on each system.
      - name: Build the SIP engine
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then npm run sidecar:hd; else npm run sidecar; fi

      # macOS: import the Developer ID certificate into a throw-away keychain, and sign every Mach-O file of the
      # engine (Tauri signs the application, not the modules it loads at run time) before it is bundled.
      - name: Sign the engine (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          # The build always reads this file; it only says something when there is a real identity to sign with.
          echo '{}' > "$RUNNER_TEMP/mac-sign.json"
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "No Developer ID certificate: the build stays ad hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/zephone.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$RUNNER_TEMP/certificate.p12"

          for file in src-tauri/binaries/libs/*.dylib src-tauri/resources/baresip/modules/*.so; do
            [[ -f "$file" ]] && codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$file"
          done
          codesign --force --options runtime --timestamp --entitlements src-tauri/Entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "src-tauri/binaries/baresip-${{ matrix.target }}"

          # Notarization goes through the App Store Connect API key.
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
          echo "ZEPHONE_MAC_SIGNED=true" >> "$GITHUB_ENV"
          # The configuration names "-" (ad hoc): the real identity replaces it for this build only.
          printf '{"bundle":{"macOS":{"signingIdentity":"%s"}}}' "$APPLE_SIGNING_IDENTITY" > "$RUNNER_TEMP/mac-sign.json"

      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: .
          releaseId: ${{ needs.meta.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ runner.os == 'macOS' && format('--config {0}/mac-sign.json', runner.temp) || '' }}

  # ------------------------------------------------------------------------------------------------ Android
  android:
    name: Android
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      ZEPHONE_SENTRY_DSN: ${{ vars.ZEPHONE_SENTRY_DSN }}
      ZEPHONE_GA_MEASUREMENT_ID: ${{ vars.ZEPHONE_GA_MEASUREMENT_ID }}
      ZEPHONE_GA_API_SECRET: ${{ secrets.ZEPHONE_GA_API_SECRET }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      # The runner image already has the Android SDK (ANDROID_HOME); only the platform and the NDK are added.
      - name: Android platform, build tools and NDK
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: .baresip-build
          key: baresip-android-${{ hashFiles('scripts/build-baresip-android.ps1', 'scripts/sidecar.mjs', 'scripts/baresip-modules/**') }}
      - run: npm ci
      - run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then echo "No upload key: the build stays unsigned."; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the bundle (Play Store) and the APK (everywhere else)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: npx tauri android build --aab --apk --target aarch64 --target x86_64
      - name: Name and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p dist-android
          aab="$(find src-tauri/gen/android/app/build/outputs -name '*.aab' | head -n1)"
          apk="$(find src-tauri/gen/android/app/build/outputs -name '*.apk' | head -n1)"
          [[ -f "$aab" && -f "$apk" ]] || { echo "::error::no AAB or APK was produced"; exit 1; }
          cp "$aab" "dist-android/ZePhone_${VERSION}_android.aab"
          cp "$apk" "dist-android/ZePhone_${VERSION}_android.apk"
          gh release upload "$TAG" "dist-android/ZePhone_${VERSION}_android.apk" --clobber
          if [[ -n "${ANDROID_KEYSTORE_FILE:-}" ]]; then gh release upload "$TAG" "dist-android/ZePhone_${VERSION}_android.aab" --clobber; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/
          retention-days: 14

  # ------------------------------------------------------------------------------------------------ iPhone and iPad
  ios:
    name: iPhone and iPad (TestFlight)
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: macos-latest
    env:
      ZEPHONE_SENTRY_DSN: ${{ vars.ZEPHONE_SENTRY_DSN }}
      ZEPHONE_GA_MEASUREMENT_ID: ${{ vars.ZEPHONE_GA_MEASUREMENT_ID }}
      ZEPHONE_GA_API_SECRET: ${{ secrets.ZEPHONE_GA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios
      - run: brew install cmake
      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: .baresip-build
          key: baresip-ios-${{ hashFiles('scripts/build-baresip-ios.sh', 'scripts/sidecar.mjs', 'scripts/ios-engine/**', 'scripts/baresip-modules/**') }}
      - run: npm ci
      - run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"
      - name: Build the application (signed for the App Store)
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: npx tauri ios build --export-method app-store-connect --build-number "${{ github.run_number }}"
      - name: Send it to TestFlight
        # A manual run only checks that the build works: nothing is sent to Apple.
        if: needs.meta.outputs.publish == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -n1)"
          [[ -f "$ipa" ]] || { echo "::error::no IPA was produced"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------------------ Mac App Store
  # Off until the variable ENABLE_MAS is "true" (see docs/MAC-APP-STORE.md for the certificates and the profile it
  # needs). The store build is not the Developer ID one: the application is sandboxed, signed with the store
  # certificate, carries a provisioning profile and goes in an installer package. Apple silicon only: the engine
  # is built for one architecture.
  mas:
    name: Mac App Store
    needs: meta
    if: needs.meta.outputs.release == 'true' && vars.ENABLE_MAS == 'true'
    runs-on: macos-latest
    env:
      ZEPHONE_SENTRY_DSN: ${{ vars.ZEPHONE_SENTRY_DSN }}
      ZEPHONE_GA_MEASUREMENT_ID: ${{ vars.ZEPHONE_GA_MEASUREMENT_ID }}
      ZEPHONE_GA_API_SECRET: ${{ secrets.ZEPHONE_GA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: mas
      - run: brew install cmake pkgconf opus spandsp libre
      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: .baresip-build
          key: baresip-aarch64-apple-darwin-${{ hashFiles('scripts/build-baresip*', 'scripts/prepare-baresip.sh', 'scripts/sidecar.mjs', 'scripts/baresip-modules/**') }}
      - run: npm ci
      - run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"
      - run: npm run sidecar:hd

      # The store certificates go into a throw-away keychain, like the Developer ID one of the desktop job.
      - name: Certificates and profile
        env:
          APP_CERTIFICATE: ${{ secrets.APPLE_MAS_APPLICATION_CERTIFICATE }}
          INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          for name in APP_CERTIFICATE INSTALLER_CERTIFICATE PROFILE; do
            [[ -n "${!name}" ]] || { echo "::error::a Mac App Store secret is missing ($name): see docs/MAC-APP-STORE.md"; exit 1; }
          done
          keychain="$RUNNER_TEMP/mas.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for kind in APP INSTALLER; do
            var="${kind}_CERTIFICATE"
            echo "${!var}" | base64 --decode > "$RUNNER_TEMP/$kind.p12"
            security import "$RUNNER_TEMP/$kind.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            rm -f "$RUNNER_TEMP/$kind.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          # The throw-away keychain holds one code-signing identity and one installer one: their names are read
          # from it, unless the variables name them.
          app_identity="${{ vars.APPLE_MAS_APP_IDENTITY }}"
          installer_identity="${{ vars.APPLE_MAS_INSTALLER_IDENTITY }}"
          [[ -n "$app_identity" ]] || app_identity="$(security find-identity "$keychain" | grep -v Installer | awk -F'"' '/"/ {print $2; exit}')"
          [[ -n "$installer_identity" ]] || installer_identity="$(security find-identity "$keychain" | awk -F'"' '/Installer/ {print $2; exit}')"
          [[ -n "$app_identity" && -n "$installer_identity" ]] || { echo "::error::no signing identity found in the certificates"; exit 1; }
          echo "Signing the code as: $app_identity"
          echo "Signing the package as: $installer_identity"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/zephone.provisionprofile"
          {
            echo "MAS_KEYCHAIN=$keychain"
            echo "MAS_APP_IDENTITY=$app_identity"
            echo "MAS_INSTALLER_IDENTITY=$installer_identity"
            echo "MAS_PROFILE=$RUNNER_TEMP/zephone.provisionprofile"
            echo "MAS_TEAM_ID=${{ vars.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # scripts/build-mas.sh builds the application (Tauri signs it ad hoc, without the private macOS API the store
      # refuses), then scripts/sign-mas.sh signs every file of the bundle with the store certificate, from the
      # inside out, embeds the profile and builds the package.
      - name: Build, sign and package
        env:
          MAS_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-mas.sh

      - name: Have Apple check the package
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
          xcrun altool --validate-app --type macos --file dist-mas/*.pkg --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Send it to App Store Connect
        # A manual run only checks that the build is valid: nothing is sent.
        if: needs.meta.outputs.publish == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: xcrun altool --upload-app --type macos --file dist-mas/*.pkg --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-app-store
          path: dist-mas/*.pkg
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------------------ publish
  publish:
    name: Publish the release
    needs: [meta, desktop, android]
    if: needs.meta.outputs.release == 'true' && needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.meta.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F make_latest=true

  distribute:
    name: Stores and package managers
    needs: [meta, publish, android]
    if: needs.meta.outputs.release == 'true' && needs.meta.outputs.publish == 'true'
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit
